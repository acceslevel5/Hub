<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub onboarding — motion concept</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body{margin:0;padding:24px;background:#e9e9ec;font-family:system-ui,sans-serif}
.note{max-width:420px;margin:0 auto 12px;font-size:13px;color:#515457;text-align:center}
.ctl{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.ctl button{padding:6px 12px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer}
.ph{position:relative;width:300px;height:600px;margin:0 auto;background:#fff;border-radius:36px;overflow:hidden;border:6px solid #1b1c1d;color:#1b1c1d}
.ib{position:absolute;width:40px;height:40px;border-radius:50%;background:#f1f1f2;display:flex;align-items:center;justify-content:center;font-size:20px}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:#6c7075;overflow:hidden;white-space:nowrap;transition:flex-grow .5s ease,opacity .3s}
.tab i{font-size:21px}.sk{background:#eef0f3;border-radius:12px}
#scrim{position:absolute;inset:66px 0 72px 0;background:rgba(255,255,255,.82);opacity:0;transition:opacity .4s;pointer-events:none}
#tip{position:absolute;left:0;right:0;bottom:0;padding:22px 20px 26px;background:#fff;border-radius:24px 24px 0 0;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1);text-align:center;border-top:1px solid #e5e6e7}
#tip button{width:100%;height:44px;border:none;border-radius:12px;background:#ff5c0a;color:#fff;font-size:14px;font-weight:500;margin-top:14px}
.ring{position:absolute;left:12px;top:14px;width:40px;height:40px;border-radius:50%;border:2px solid #ff5c0a;opacity:0;pointer-events:none;box-sizing:border-box}
#content{position:absolute;inset:66px 0 72px 0;padding:8px 16px}
</style></head><body>
<p class="note">მოძრაობის კონცეფცია (სქემატური). ვიზუალი და ასეტები Figma-დან, ტაიმინგი და მოძრაობა — ამ ფაილიდან.</p>
<div class="ctl"><button data-v="0">ქოფი A</button><button data-v="1">ქოფი B</button><button data-v="2">ქოფი C</button><button id="replay">თავიდან</button></div>
<div class="ph" id="ph">
  <div class="ib" id="tl" style="left:12px;top:14px"><i class="ti ti-qrcode" id="tlIcon"></i></div>
  <div style="position:absolute;left:60px;top:24px;font-size:16px;font-weight:500">მთავარი</div>
  <div class="ib" id="srch" style="left:150px;top:14px;transition:all .45s ease"><i class="ti ti-search"></i></div>
  <div class="ib" style="left:196px;top:14px"><i class="ti ti-message-dots"></i></div>
  <div class="ib" style="left:242px;top:14px;background:#f5c48e"><i class="ti ti-user" style="color:#7a4a12"></i></div>
  <div class="ring" id="ring"></div>
  <div id="content">
    <div style="display:flex;gap:8px"><div class="sk" style="width:76px;height:96px;border:2px solid #ffb48a"></div><div class="sk" style="width:76px;height:96px;border:2px solid #ffb48a"></div><div class="sk" style="width:76px;height:96px;border:2px solid #ffb48a"></div></div>
    <div style="margin-top:18px;font-size:11px;color:#515457">ხელმისაწვდომი თანხა</div><div style="font-size:18px;font-weight:500">1030.64 ₾</div>
    <div class="sk" style="height:130px;margin-top:12px;background:#f0f5fa;padding:14px;box-sizing:border-box"><div style="font-size:11px;color:#515457;margin-top:46px">უნივერსალური ანგარიში</div><div style="font-size:26px;font-weight:500">1030.64 ₾</div></div>
  </div>
  <div id="scrim"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:72px;border-top:1px solid #e5e6e7;background:#fff;display:flex;align-items:flex-start;padding:10px 4px 0;box-sizing:border-box">
    <div class="tab" style="color:#ff5c0a"><i class="ti ti-home"></i>მთავარი</div>
    <div class="tab"><i class="ti ti-stack-2"></i>ჩემი სივრცე</div>
    <div class="tab"><i class="ti ti-transfer" id="trI" style="background:#eef0f3;border-radius:50%;padding:9px;transition:all .4s"></i><span id="trL" style="opacity:0;transition:opacity .4s">გადარიცხვა</span></div>
    <div class="tab"><i class="ti ti-discount"></i>შეთავაზებები</div>
    <div class="tab" id="hubTab"><i class="ti ti-layout-grid" id="hubI"></i>ჰაბი</div>
  </div>
  <div id="tip"><div style="font-size:11px;color:#ff5c0a;font-weight:500">სიახლე</div><div style="font-size:18px;font-weight:500;margin-top:6px" id="tH"></div><div style="font-size:13px;color:#515457;line-height:1.5;margin-top:6px" id="tB"></div><button id="tC"></button></div>
  <i class="ti ti-hand-finger" id="hand" style="position:absolute;left:40%;top:46%;font-size:34px;opacity:0;pointer-events:none"></i>
</div>
<script>
const V=[{h:"ჰაბი ახლა აქ არის",b:"ყველა სერვისი და ძიება ზედა მარცხენა კუთხეშია. ან გადაასრიალე ეკრანი მარჯვნივ.",c:"გასაგებია"},
{h:"ძიება და ჰაბი ერთ ადგილას",b:"ნებისმიერი სერვისი თუ პროდუქტი ახლა ერთი შეხებით იძებნება.",c:"სცადე"},
{h:"ჰაბი ზემოთ ავიდა",b:"ჰაბი და ძიება გავაერთიანეთ, რომ საჭირო რამე უფრო სწრაფად იპოვო.",c:"გასაგებია"}];
let v=0,timers=[];const $=id=>document.getElementById(id);
function setCopy(){$('tH').textContent=V[v].h;$('tB').textContent=V[v].b;$('tC').textContent=V[v].c}
function T(ms,f){timers.push(setTimeout(f,ms))}
function reset(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.fly').forEach(e=>e.remove());
$('tlIcon').className='ti ti-qrcode';$('srch').style.cssText='left:150px;top:14px;transition:none';$('srch').innerHTML='<i class="ti ti-search"></i>';
$('hubTab').style.flexGrow=1;$('hubTab').style.opacity=1;$('hubI').style.visibility='visible';$('hubI').getAnimations().forEach(a=>a.cancel());
$('trI').style.cssText='background:#eef0f3;border-radius:50%;padding:9px;transition:none';$('trL').style.opacity=0;
$('scrim').style.opacity=0;$('tip').style.transform='translateY(110%)';void $('ph').offsetWidth;$('srch').style.transition='all .45s ease';$('trI').style.transition='all .4s'}
function play(){reset();const ph=$('ph').getBoundingClientRect();
T(700,()=>{$('scrim').style.opacity=1;$('hubI').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1.15)'}],{duration:500,fill:'forwards'})});
T(1400,()=>{const r=$('hubI').getBoundingClientRect(),t=$('tl').getBoundingClientRect();
const f=document.createElement('i');f.className='ti ti-layout-grid fly';f.style.cssText=`position:absolute;font-size:21px;color:#ff5c0a;left:${r.left-ph.left-6}px;top:${r.top-ph.top-6}px;z-index:5`;$('ph').appendChild(f);$('hubI').style.visibility='hidden';
const dx=t.left-r.left+10,dy=t.top-r.top+10;
f.animate([{transform:'translate(0,0) scale(1.15)'},{transform:`translate(${dx*.45}px,${dy*.75}px) scale(1.6) rotate(-14deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(1)`}],{duration:850,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'});
$('tl').animate([{transform:'translateX(0)'},{transform:'translateX(96px)'}],{duration:450,easing:'ease-in-out',fill:'forwards'});
T(80,()=>{$('srch').style.transform='translateX(-96px) scale(.4)';$('srch').style.opacity=0});
T(300,()=>{$('hubTab').style.flexGrow=0;$('hubTab').style.opacity=0;$('trI').style.background='transparent';$('trI').style.padding='0';$('trL').style.opacity=1});
T(860,()=>{f.remove();$('tl').getAnimations().forEach(a=>a.cancel());$('srch').style.cssText='left:150px;top:14px;transition:none';$('srch').innerHTML='<i class="ti ti-qrcode"></i>';
$('tlIcon').className='ti ti-list-search';$('tl').animate([{transform:'scale(.7)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});
$('ring').animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.9)'}],{duration:900,iterations:2,easing:'ease-out'})})});
T(3000,()=>{$('tip').style.transform='translateY(0)'})}
$('tC').onclick=()=>{$('tip').style.transform='translateY(110%)';$('scrim').style.opacity=0;
T(450,()=>{$('hand').animate([{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'translateX(-30px)',offset:.2},{opacity:1,transform:'translateX(50px)',offset:.7},{opacity:0,transform:'translateX(50px)'}],{duration:1100,easing:'ease-in-out'});
$('content').animate([{transform:'translateX(0)'},{transform:'translateX(0)',offset:.25},{transform:'translateX(56px)',offset:.65},{transform:'translateX(0)'}],{duration:1100,easing:'ease-in-out'})})};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=+b.dataset.v;setCopy()});$('replay').onclick=play;setCopy();play();
</script></body></html>
