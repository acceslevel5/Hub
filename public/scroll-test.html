<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll test</title>
    <!--
      Useberry-ის დიაგნოსტიკა: უბრალო გრძელი გვერდი (აპის გარეშე).
      თუ ამ გვერდის სქრინშოტზეც მხოლოდ პირველი ეკრანი ჩანს, Useberry მობილურზე მხოლოდ ხილულ ნაწილს იღებს.
    -->
    <style>
      body { margin: 0; font: 600 20px/1 system-ui, sans-serif; }
      .band { height: 300px; display: flex; align-items: center; justify-content: center; color: #fff; }
      button { font: inherit; padding: 12px 20px; border-radius: 12px; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <script>
      var colors = ['#e4572e', '#17bebb', '#ffc914', '#2e282a', '#76b041', '#6a4c93', '#1982c4', '#ff595e', '#8ac926', '#3d405b']
      for (var i = 0; i < 10; i++) {
        document.write('<div class="band" style="background:' + colors[i] + '"><button>' + (i * 300) + 'px – ' + (i + 1) + '</button></div>')
      }
    </script>
    <script type="text/javascript" src="https://api.useberry.com/integrations/liveUrl/scripts/useberryScript.js"></script>
  </body>
</html>
